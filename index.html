<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简黑卡导航</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #333333;
            --delete-red: #ff4d4d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 顶部控制栏 */
        .header {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
            font-size: 1.5rem;
        }

        .btn-add {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add:hover {
            background: #444;
        }

        /* 导航网格 */
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1000px;
            padding: 20px;
        }

        /* 网站卡片样式 */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #222;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background: #222;
        }

        .card:active {
            cursor: grabbing;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            margin-bottom: 12px;
            object-fit: cover;
        }

        .site-name {
            font-size: 0.85rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* 删除按钮 */
        .btn-delete {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
            color: #999;
        }

        .card:hover .btn-delete {
            opacity: 1;
        }

        .btn-delete:hover {
            background: var(--delete-red);
            color: white;
        }

        /* 拖动时的占位样式 */
        .sortable-ghost {
            opacity: 0.3;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            #grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>导航 / NAVIGATION</h1>
        <button class="btn-add" onclick="addNewSite()">+ 添加</button>
    </div>

    <div id="grid">
        </div>

    <script>
        // 初始数据
        const defaultSites = [
            { name: '百度', url: 'https://www.baidu.com' },
            { name: '哔哩哔哩', url: 'https://www.bilibili.com' },
            { name: '知乎', url: 'https://www.zhihu.com' },
            { name: '微博', url: 'https://weibo.com' },
            { name: 'GitHub', url: 'https://github.com' },
            { name: '豆瓣', url: 'https://www.douban.com' }
        ];

        let sites = JSON.parse(localStorage.getItem('myNavigation')) || defaultSites;

        const grid = document.getElementById('grid');

        // 渲染页面
        function render() {
            grid.innerHTML = '';
            sites.forEach((site, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-index', index);
                
                // 使用 Google 的 Favicon 服务获取 Logo，如果获取不到可以使用首字母代替
                const iconUrl = `https://www.google.com/s2/favicons?sz=128&domain=${site.url}`;

                card.innerHTML = `
                    <div class="btn-delete" onclick="deleteSite(event, ${index})">✕</div>
                    <a href="${site.url}" target="_blank" style="text-decoration:none; color:inherit; display:flex; flex-direction:column; align-items:center; width:100%">
                        <img class="logo-img" src="${iconUrl}" alt="${site.name}" onerror="this.src='https://via.placeholder.com/48/333/fff?text=${site.name[0]}'">
                        <div class="site-name">${site.name}</div>
                    </a>
                `;
                grid.appendChild(card);
            });
            saveData();
        }

        // 添加新站点
        function addNewSite() {
            const name = prompt("请输入网站名称:");
            let url = prompt("请输入网站地址 (例如: https://example.com):");
            
            if (name && url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                sites.push({ name, url });
                render();
            }
        }

        // 删除站点
        function deleteSite(event, index) {
            event.preventDefault();
            event.stopPropagation();
            if(confirm('确定删除这个网站吗？')) {
                sites.splice(index, 1);
                render();
            }
        }

        // 保存数据到本地缓存
        function saveData() {
            localStorage.setItem('myNavigation', JSON.stringify(sites));
        }

        // 初始化拖拽功能
        new Sortable(grid, {
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function() {
                // 拖拽结束后更新数组顺序
                const newSites = [];
                document.querySelectorAll('.card').forEach(card => {
                    const oldIndex = card.getAttribute('data-index');
                    newSites.push(sites[oldIndex]);
                });
                sites = newSites;
                render(); // 重新渲染以更新索引
            }
        });

        // 首次加载
        render();
    </script>
</body>
</html>
