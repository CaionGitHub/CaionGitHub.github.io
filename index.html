<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简黑卡导航 - 增强版</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #333333;
            --nav-bg: rgba(20, 20, 20, 0.9);
            --delete-red: #ff4d4d;
            --btn-blue: #2196F3;
            --btn-green: #4CAF50;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 顶部导航 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: center;
            padding: 15px 0;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: #fff; }

        .container {
            width: 90%;
            max-width: 1200px;
            margin-bottom: 120px;
        }

        .category-section {
            margin-top: 40px;
            padding-top: 20px;
        }

        .category-title {
            font-size: 1.2rem;
            font-weight: 300;
            border-left: 4px solid #444;
            padding-left: 15px;
            margin-bottom: 20px;
            color: #aaa;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px;
            min-height: 80px;
            padding: 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            border: 1px dashed transparent;
            transition: border-color 0.3s;
        }

        /* 拖拽悬停反馈 */
        .grid.drag-over { border-color: #444; }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            cursor: grab;
            transition: all 0.2s;
            border: 1px solid #222;
        }

        .card:hover {
            transform: translateY(-5px);
            background: #252525;
            border-color: #444;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin-bottom: 10px;
            pointer-events: none;
        }

        .site-name {
            font-size: 0.75rem;
            color: #ccc;
            text-align: center;
        }

        .btn-delete {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            color: #555;
            cursor: pointer;
            opacity: 0;
        }

        .card:hover .btn-delete { opacity: 1; }

        /* 右下角控制面板 */
        .controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-action {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn-action:hover { transform: scale(1.1); }
        .btn-add { background: #fff; color: #000; font-size: 24px; }
        .btn-export { background: var(--btn-blue); }
        .btn-import { background: var(--btn-green); }

        .sortable-ghost { opacity: 0.2; transform: scale(0.8); }
    </style>
</head>
<body id="home">

    <nav class="navbar">
        <div class="nav-links">
            <a href="#home">首页</a>
            <a href="#common">常用</a>
            <a href="#work">工作</a>
            <a href="#study">学习</a>
            <a href="#news">新闻</a>
            <a href="#video">影视</a>
        </div>
    </nav>

    <div class="container" id="main-content"></div>

    <div class="controls">
        <button class="btn-action btn-import" onclick="triggerImport()" title="导入配置">↑</button>
        <button class="btn-action btn-export" onclick="exportConfig()" title="导出配置">↓</button>
        <button class="btn-action btn-add" onclick="addNewSite()" title="添加网站">+</button>
    </div>

    <input type="file" id="fileInput" style="display: none" accept=".json" onchange="importConfig(event)">

    <script>
        const categories = [
            { id: 'common', name: '常用' },
            { id: 'work', name: '工作' },
            { id: 'study', name: '学习' },
            { id: 'news', name: '新闻' },
            { id: 'video', name: '影视' }
        ];

        const defaultSites = [
            { name: 'Google', url: 'https://www.google.com', cat: 'common' },
            { name: 'ChatGPT', url: 'https://chat.openai.com', cat: 'common' },
            { name: 'Claude', url: 'https://claude.ai', cat: 'common' },
            { name: 'Gmail', url: 'https://mail.google.com', cat: 'work' },
            { name: '中华法考', url: 'http://www.chinalawedu.com', cat: 'study' },
            { name: 'BBC News', url: 'https://www.bbc.com/news', cat: 'news' },
            { name: 'AP News', url: 'https://apnews.com', cat: 'news' },
            { name: 'YouTube', url: 'https://www.youtube.com', cat: 'video' },
            { name: 'Bilibili', url: 'https://www.bilibili.com', cat: 'video' }
        ];

        let sites = JSON.parse(localStorage.getItem('nav_data_v2')) || defaultSites;

        function render() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';

            categories.forEach(cat => {
                const section = document.createElement('section');
                section.className = 'category-section';
                section.id = cat.id;

                const title = document.createElement('div');
                title.className = 'category-title';
                title.innerText = cat.name;

                const grid = document.createElement('div');
                grid.className = 'grid';
                grid.setAttribute('data-category', cat.id);

                const catSites = sites.filter(s => s.cat === cat.id);
                catSites.forEach(site => {
                    grid.appendChild(createCard(site));
                });

                section.appendChild(title);
                section.appendChild(grid);
                container.appendChild(section);

                new Sortable(grid, {
                    group: 'shared',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: handleSortEnd
                });
            });
        }

        function createCard(site) {
            const div = document.createElement('div');
            div.className = 'card';
            div.setAttribute('data-url', site.url);
            div.setAttribute('data-name', site.name);
            const iconUrl = `https://www.google.com/s2/favicons?sz=128&domain=${site.url}`;
            div.innerHTML = `
                <div class="btn-delete" onclick="removeSite(this)">✕</div>
                <img class="logo-img" src="${iconUrl}" onerror="this.src='https://via.placeholder.com/40/333/fff?text=${site.name[0]}'">
                <div class="site-name">${site.name}</div>
            `;
            div.onclick = (e) => {
                if(e.target.className !== 'btn-delete') window.open(site.url, '_blank');
            };
            return div;
        }

        function handleSortEnd() {
            const newSites = [];
            document.querySelectorAll('.grid').forEach(grid => {
                const catId = grid.getAttribute('data-category');
                grid.querySelectorAll('.card').forEach(card => {
                    newSites.push({
                        name: card.getAttribute('data-name'),
                        url: card.getAttribute('data-url'),
                        cat: catId
                    });
                });
            });
            sites = newSites;
            save();
        }

        // --- 导出功能 ---
        function exportConfig() {
            const dataStr = JSON.stringify(sites, null, 4);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            
            const exportFileDefaultName = 'nav_config.json';
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
        }

        // --- 导入功能 ---
        function triggerImport() {
            document.getElementById('fileInput').click();
        }

        function importConfig(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if(confirm('确定要覆盖现有配置吗？')) {
                            sites = importedData;
                            save();
                            render();
                            alert('配置导入成功！');
                        }
                    } else {
                        alert('文件格式错误，请使用导出的 JSON 文件。');
                    }
                } catch (err) {
                    alert('读取文件失败，请重试。');
                }
            };
            reader.readAsText(file);
        }

        function addNewSite() {
            const name = prompt("网站名称:");
            let url = prompt("网站地址 (含http):");
            const cat = prompt("分类 (common/work/study/news/video):", "common");
            if (name && url) {
                if (!url.startsWith('http')) url = 'https://' + url;
                sites.push({ name, url, cat });
                render();
                save();
            }
        }

        function removeSite(el) {
            if(confirm('删除此链接？')) {
                el.parentElement.remove();
                handleSortEnd();
            }
        }

        function save() {
            localStorage.setItem('nav_data_v2', JSON.stringify(sites));
        }

        render();
    </script>
</body>
</html>
